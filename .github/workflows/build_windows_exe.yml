name: Build NeverAI Windows .exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & PyWebView + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . pywebview pyinstaller

      - name: Generate Brand Icon & Bootstrap Seed Brain
        run: |
          python scripts/generate_brand_assets.py
          python -c "from never_ai.engine import NeverAIEngine; e = NeverAIEngine(); e.train_steps(num_steps=80, batch_size=8)"

      - name: Compile NeverAI.exe via PyInstaller
        run: |
          pyinstaller --noconfirm --clean packaging/windows/never_ai_desktop.spec
          mkdir dist\NeverAI\never_ai_data\checkpoints -Force
          xcopy checkpoints dist\NeverAI\never_ai_data\checkpoints /E /I /Y

      - name: Upload NeverAI-Windows-x64 .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeverAI-Windows-x64
          path: dist/NeverAI/
