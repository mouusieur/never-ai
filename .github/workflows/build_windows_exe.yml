name: Build NeverAI Windows .exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & PyWebView + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . pywebview pyinstaller

      - name: Generate Brand Icon & Bootstrap Seed Brain
        run: |
          python scripts/generate_brand_assets.py
          python -c "from never_ai.engine import NeverAIEngine; e = NeverAIEngine(); e.train_steps(num_steps=60, batch_size=8)"

      - name: Compile Standalone NeverAI.exe via PyInstaller
        run: |
          pyinstaller --noconfirm --clean packaging/windows/never_ai_desktop.spec
          New-Item -ItemType Directory -Force -Path dist\NeverAI\never_ai_data\checkpoints | Out-Null
          Copy-Item -Recurse -Force checkpoints\* dist\NeverAI\never_ai_data\checkpoints\
          Compress-Archive -Path dist\NeverAI\* -DestinationPath NeverAI-Standalone-Windows-x64.zip -Force

      - name: Upload NeverAI-Windows-x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeverAI-Windows-x64
          path: |
            dist/NeverAI/
            NeverAI-Standalone-Windows-x64.zip

      - name: Attach Installers & Standalone Portable Bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          gh release upload $tag releases\NeverAI-Setup.exe releases\NeverAI-Installer-Windows-x64.zip NeverAI-Standalone-Windows-x64.zip --clobber
