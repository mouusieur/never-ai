[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "never-ai"
version = "1.4.1"
description = "ChronoMorph-LM: Native Windows x64 Setup (.exe), Zero-Reinstall Remote OTA Auto-Updater, Multi-Register Chat & Live Web Search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5.0",
    "tokenizers>=0.20.0",
    "safetensors>=0.4.5",
    "numpy>=2.0.0",
    "sympy>=1.13.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
never-ai-desktop = "never_ai.desktop.launcher:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
